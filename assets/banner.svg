<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Text & Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.3" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes waveFlow {
      0% { transform: translateX(0); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0); }
    }
    .wave-anim1 {
      animation: waveFlow 10s ease-in-out infinite;
    }
    .wave-anim2 {
      animation: waveFlow 7s ease-in-out infinite reverse;
    }
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      fill: #94a3b8;
    }
    .badge {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.5px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Rect with Rounded Corners -->
  <rect width="1000" height="240" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="1" />

  <!-- Subtle Tech Grid -->
  <rect width="1000" height="240" rx="16" fill="url(#grid)" />

  <!-- Glowing Corner Orbs -->
  <circle cx="100" cy="40" r="120" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle cx="900" cy="80" r="140" fill="#a855f7" opacity="0.15" filter="url(#glow)" />

  <!-- Animated Wave Paths at Bottom -->
  <g class="wave-anim1">
    <path d="M-100 180 C 150 140, 350 220, 600 170 C 850 120, 1050 200, 1200 180 L 1200 240 L -100 240 Z" fill="url(#wave1)" />
  </g>
  <g class="wave-anim2">
    <path d="M-100 200 C 200 160, 400 230, 700 180 C 950 140, 1100 210, 1200 190 L 1200 240 L -100 240 Z" fill="url(#wave2)" />
  </g>

  <!-- Content Group -->
  <g transform="translate(60, 0)">
    <!-- Extra Spacious Pill Badge (width=305px) -->
    <g transform="translate(0, 38)">
      <rect width="305" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="16" cy="14" r="4.5" fill="#22c55e" />
      <text x="30" y="18" class="badge">FRONTEND ENGINEER 2 @ SEQUOIA</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="116" class="title" fill="#ffffff">
      Hey there, I'm <tspan fill="url(#accent-grad)">Akash Gupta</tspan> 👋
    </text>

    <!-- Subtitle -->
    <text x="0" y="153" class="subtitle">
      Frontend Engineer 2 @ Sequoia • 6+ Years Building Scalable High-Impact Systems
    </text>
  </g>
</svg>
